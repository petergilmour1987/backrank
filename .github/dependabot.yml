version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Only xtask has dependencies: the backrank crate is std-only.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      xtask:
        patterns: ["*"]
