[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "Development tooling for the Backrank Chess Engine (run via `cargo xtask`)"
publish = false
default-run = "xtask"

[dependencies]
anyhow = "1.0.104"
backrank = { version = "0.1.0", path = ".." }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.2.0"
